name: CI

on:
  push:
    branches: [main, development, messenger-development]
  pull_request:

# Two independent npm packages, no root package.json — one job each.
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_BACKEND_URI: http://localhost:9000

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # No test runner is configured (npm test intentionally exits 1). Many
      # backend modules connect to Mongo / start a server on require, so the
      # check is parse-only: node --check every source file (catches syntax
      # errors without executing side effects).
      - run: >
          node -e "const {execFileSync}=require('child_process');
          require('fs').readdirSync('.',{recursive:true})
          .filter(f => f.endsWith('.js') && !String(f).includes('node_modules'))
          .forEach(f => execFileSync(process.execPath,['--check',f],{stdio:'inherit'}));"
