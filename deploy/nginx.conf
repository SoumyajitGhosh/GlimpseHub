worker_processes auto;
worker_rlimit_nofile 1048576;

events {
    worker_connections 262144;
    multi_accept on;
}

http {
    # Docker's DNS returns every replica of `backend`; re-resolve so scaling up/down is picked up.
    resolver 127.0.0.11 valid=10s;

    upstream backend {
        least_conn;
        # Compose service name resolves to all replicas (docker compose up --scale backend=N)
        server backend:9000 max_fails=3 fail_timeout=10s;
        keepalive 256;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        client_max_body_size 11m;   # post uploads cap at 10 MB

        location /healthz {
            proxy_pass http://backend;
        }

        # REST API
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO (client uses websocket-only transport, so no sticky sessions are needed)
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
